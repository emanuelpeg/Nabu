# ===============================
# Configuración Nabu (Entorno de Test)
# ===============================
# Forzamos el adaptador de H2 para las pruebas
nabu.db.type=H2

# ===============================
# Configuración de Spring DataSource (Test)
# ===============================
# Usamos H2 en memoria para que cada test corra en un entorno limpio y rápido
spring.datasource.url=jdbc:h2:mem:nabu_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Opcional: Mostrar SQL en los logs para depurar los tests
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG